<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#17734e">
    <title>غير متصل بالإنترنت | اكريلي</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f8f6; color: #17231d; font-family: Arial, sans-serif; text-align: center; }
      main { max-width: 420px; padding: 32px 24px; border: 1px solid #e2e8e3; border-radius: 24px; background: white; }
      .mark { display: grid; width: 56px; height: 56px; margin: 0 auto 20px; place-items: center; border-radius: 18px; background: #e8f4ec; color: #17734e; font-size: 30px; font-weight: 800; }
      h1 { margin: 0; color: #145b3e; font-size: 22px; }
      p { margin: 12px 0 0; color: #65736b; font-size: 14px; line-height: 1.8; }
      button { min-height: 48px; margin-top: 24px; padding: 0 20px; border: 0; border-radius: 14px; background: #17734e; color: white; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ا</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تحقق من اتصالك ثم أعد المحاولة. لا تُعرض بيانات الحساب أو الطلبات المحفوظة دون اتصال.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
